<style>
@font-face{font-family:"Instrument Serif";src:url("/assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Instrument Serif";src:url("/assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--bg:#fff;--ink:#000;--muted:#6e6e73;--rule:rgba(0,0,0,.1);--serif:"Instrument Serif","Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--pad:clamp(16px,4vw,64px);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
#lock{min-height:100svh;display:grid;place-items:center;padding:var(--pad)}
#lock form{width:min(360px,100%);animation:in .6s var(--ease) both}
#lock h1{font:400 clamp(40px,7vw,64px)/1 var(--serif);letter-spacing:-.02em;margin-bottom:24px}
#lock h1 em{font-style:italic}
#lock label{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}
#lock input{width:100%;font:inherit;font-size:14px;border:0;border-bottom:1px solid var(--ink);padding:10px 0;background:none;outline:none;border-radius:0}
#lock button{margin-top:20px;font:inherit;font-size:11px;background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0;cursor:pointer;color:var(--ink)}
#lock button:hover{border-color:var(--ink)}
#msg{margin-top:14px;min-height:18px;color:var(--muted);font-size:11px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:IT,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V)},key,u(C));return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
function mount(html){document.getElementById("lock").remove();const t=document.createElement("div");t.innerHTML=html;
[...t.childNodes].forEach(n=>document.body.appendChild(n));
document.querySelectorAll("body script[data-run]").forEach(s=>{const x=document.createElement("script");x.textContent=s.textContent;s.replaceWith(x)})}
const f=document.querySelector("#lock form"),m=document.getElementById("msg");
f.addEventListener("submit",async e=>{e.preventDefault();m.textContent="Unlocking";
try{const pw=document.getElementById("pw").value;const h=await open(pw);try{sessionStorage.setItem("ms_p",pw)}catch(_){}mount(h)}catch(_){m.textContent="That password did not work."}});
let s=null;try{s=sessionStorage.getItem("ms_p")}catch(_){}
if(s)open(s).then(mount).catch(()=>{try{sessionStorage.removeItem("ms_p")}catch(_){}});
})();
</script></body></html>
