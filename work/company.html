<style>
:root{
  --bg:#000; --ink:#fff; --muted:#8a8a8a; --subtle:#555; --rule:rgba(255,255,255,.14);
  --ph:#0e0e0e; --ph2:#1c1c1c;
  --glass:rgba(255,255,255,.80); --glass-blur:blur(24px) saturate(180%);
  --font:Helvetica,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","Fira Code","Roboto Mono",ui-monospace,Menlo,monospace;
  --t:13px; --pad:clamp(15px,2vw,50px); --nav:3.25rem; --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme=light]{--bg:#fff;--ink:#000;--muted:#6e6e73;--subtle:#86868b;--rule:rgba(0,0,0,.1);--ph:#ededf0;--ph2:#f6f6f8}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;overflow-x:clip}
body{font-family:var(--font);font-size:var(--t);line-height:1.75;color:var(--ink);background:var(--bg);transition:background .15s,color .15s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.ph-tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#e0006e}
.b{font-weight:700}
[hidden]{display:none!important}

.nav{position:fixed;inset:0 0 auto 0;height:var(--nav);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);z-index:50;mix-blend-mode:difference;color:#fff}
.mark{font-weight:700;font-size:13px;line-height:.95;letter-spacing:-.02em}
.mark span{display:block}.mark span:nth-child(2){padding-left:.55em}
.nav ul{display:flex;gap:1.6rem;list-style:none;align-items:center}
.nav a{opacity:.85}.nav a:hover{opacity:1}
.toggle{width:14px;height:14px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}

/* banner (Shayne "Museum" page: full-bleed media, then spaced title) */
.banner{position:relative;height:56vh;min-height:380px;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.banner .ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 90% at 50% 40%,#1d1d1d,#000 70%)}
.banner .ph{position:relative}
.banner .corner{position:absolute;bottom:var(--pad);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.banner .corner.l{left:var(--pad)}.banner .corner.r{right:var(--pad)}
.banner.has-img::before{display:none}
.banner .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.banner .corner{z-index:2}
.banner.photo::before{content:"";display:block!important;position:absolute;inset:0 0 auto 0;height:22%;background:linear-gradient(rgba(0,0,0,.4),transparent);z-index:1;pointer-events:none}
body.hero-dark .nav{mix-blend-mode:normal;color:#fff}
body.hero-light .nav{mix-blend-mode:normal;color:#000}
.banner.photo .corner{color:rgba(255,255,255,.85)}
.banner.logo .hero-img{object-fit:contain;inset:30% 20%;width:60%;height:40%}
.banner.logo .corner{color:rgba(0,0,0,.55)}
.banner.none{display:none}
.video{padding:clamp(3rem,6vw,5rem) var(--pad) 0}
.video[hidden]{display:none}
.aud{padding:clamp(3rem,6vw,5rem) var(--pad) 0}
.player{display:flex;align-items:center;gap:1rem;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:1rem 0}
.pp{flex:none;width:36px;height:36px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.pp:hover{background:var(--ink);color:var(--bg)}
.pp .ic{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.pp.on .ic{width:9px;height:11px;border:0;margin:0;border-left:3px solid currentColor;border-right:3px solid currentColor}
.ameta{flex:1;min-width:0}
.arow{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin-bottom:.6rem}
.alabel{font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alabel::before{content:"↳ ";opacity:.5}
.atime{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.bar{position:relative;height:9px;cursor:pointer}
.bar::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--rule)}
.bar .fill{position:absolute;left:0;top:4px;height:1px;width:0;background:var(--ink)}
.deck .s-head .hlink{font-size:12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;transition:opacity .15s}.deck .s-head .hlink:hover{opacity:.6}
.deckcard{display:block;width:min(100%,640px);color:var(--ink)}
.deckcard .dmedia{position:relative;aspect-ratio:1200/630;background:#fff;border:1px solid var(--rule);border-radius:0;overflow:hidden}
.deckcard .dmedia img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.deckcard .dmedia::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .25s}
.deckcard:hover .dmedia::after{opacity:.06}.deckcard:hover .dmedia img{transform:scale(1.025)}
.deckcard .dcap{display:flex;justify-content:space-between;gap:.75rem;padding-top:.5rem;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.deckcard .dcap span:first-child::before{content:"↳ ";opacity:.5}
.deckcard .go{font-family:var(--mono);font-size:10px;color:var(--muted);transition:color .15s}.deckcard:hover .go{color:var(--ink)}
.video{display:grid;gap:clamp(14px,1.6vw,24px)}
.aud:not([hidden]) + .video{padding-top:clamp(1.5rem,3vw,2.5rem)}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,24px);align-items:start}
.igcell{min-width:0}
.igcell .instagram-media{min-width:0!important;max-width:100%!important;width:100%!important;margin:0!important;border-radius:0!important;box-shadow:none!important;border:1px solid var(--rule)!important}
.igcell iframe{min-width:0!important;max-width:100%!important;width:100%!important;border-radius:0!important}
@media(max-width:1100px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.igrid{grid-template-columns:1fr;max-width:540px;margin:0 auto}}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:0;overflow:hidden}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0}
body.no-hero .title{padding-top:calc(var(--nav) + clamp(3rem,6vw,5rem))}
.title{padding:clamp(3rem,6vw,5rem) var(--pad) 0;text-align:center}
.display{font-weight:700;font-size:clamp(28px,4.2vw,58px);letter-spacing:.32em;text-transform:uppercase;line-height:1;margin-right:-.32em}
.title p{color:var(--muted);margin-top:.6rem}

/* intro: akili two-column (prose left, role/output/result right) in Shayne spec-card language */
.intro.two{grid-template-columns:1fr 1fr;justify-content:stretch}
.intro{display:grid;grid-template-columns:minmax(0,640px);justify-content:center;gap:var(--pad);padding:clamp(3rem,6vw,5rem) var(--pad) 0;align-items:stretch}
.card{background:#fff;color:#000;padding:1.25rem;box-shadow:0 4px 24px rgba(0,0,0,.06);outline:1px solid rgba(0,0,0,.04)}
[data-theme=dark] .card{background:#0d0d0d;color:#fff;outline:1px solid rgba(255,255,255,.08)}
.card .line{font-size:15px;line-height:1.6;padding-bottom:.8rem;margin-bottom:.2rem;border-bottom:1px solid currentColor}
.card .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid currentColor;padding-bottom:.3rem;margin-bottom:.5rem}
.card .prose p{margin-top:.75rem;opacity:.85;max-width:62ch}
.card .prose p:first-child{margin-top:.2rem}
.row{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;padding:.55rem 0;border-bottom:1px solid currentColor;align-items:baseline}
.row:last-child{border-bottom:0}
.row .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.row .k::before{content:"↳ "}
.row .v{display:flex;justify-content:space-between;gap:1rem}
.row a.u{text-decoration:underline;text-underline-offset:3px}

/* selected work: akili masonry of mixed vertical tiles */
.sel{padding:clamp(4rem,8vw,7rem) var(--pad) 0}
.s-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:.35rem;margin-bottom:1.25rem}
.s-head h2{font-weight:400;font-size:var(--t)}
.s-head h2::before{content:"↳ "}
.s-head .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
.masonry{columns:4;column-gap:clamp(8px,1vw,16px)}
.tile{display:block;break-inside:avoid;margin-bottom:clamp(14px,1.6vw,24px);cursor:pointer}
.tile .media{position:relative;background:radial-gradient(120% 90% at 30% 20%,var(--ph2),var(--ph) 70%);outline:1px solid var(--rule);outline-offset:-1px;overflow:hidden}
.tile .media.v{aspect-ratio:9/16}.tile .media.p{aspect-ratio:4/5}.tile .media.s{aspect-ratio:1/1}
.tile .media span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle)}
.tile .media i{position:absolute;right:.7rem;bottom:.6rem;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--subtle)}
.tile .media::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .25s}
.tile:hover .media::after{opacity:.08}
.tile .cap{display:flex;justify-content:space-between;gap:.75rem;padding-top:.45rem;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tile .cap .n::before{content:"↳ ";opacity:.5}
.tile .cap .m{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:.15em}
/* guest cards (The Wealth Break) */
.gwrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.6vw,24px);align-items:start}
.guest{display:block;color:var(--ink);min-width:0}
.guest .gmedia{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ph);border-radius:0;outline:1px solid var(--rule);outline-offset:-1px}
.guest .gmedia img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.guest .gmedia::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .25s}
.guest:hover .gmedia::after{opacity:.08}.guest:hover .gmedia img{transform:scale(1.025)}
.guest .gname{padding-top:.5rem;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.guest .gname::before{content:"↳ ";opacity:.5}
.guest .gep{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:.15rem;transition:color .15s}.guest:hover .gep{color:var(--ink)}
/* blocks: video rows, single video, link lists (SXYLK) */
.xblk{padding:clamp(4rem,8vw,7rem) var(--pad) 0}
.xblk + .xblk{padding-top:clamp(3rem,6vw,5rem)}
.vrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,24px);align-items:start}
.vcap{padding-top:.5rem;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.vcap::before{content:"↳ ";opacity:.5}
@media(max-width:1100px){.vrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.vrow{grid-template-columns:1fr}}
/* earned press list (Alibi Lounge) */
.press{border-top:0}
.pr{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr auto;gap:1.25rem;padding:.85rem 0;border-bottom:1px solid var(--rule);align-items:baseline;color:var(--ink)}
.pr .po{font-weight:700;font-size:13px}
.pr .ph{font-size:13px;transition:opacity .15s}
.pr .pd{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.pr .pd::after{content:"  ↗";color:var(--muted);transition:color .15s}
.pr:hover .ph{text-decoration:underline;text-underline-offset:3px}.pr:hover .pd::after{color:var(--ink)}
@media(max-width:700px){.pr{grid-template-columns:1fr auto;gap:.2rem 1rem}.pr .po{grid-column:1/-1}}
@media(max-width:700px){.gwrap{grid-template-columns:1fr;max-width:480px;margin:0 auto}}

/* prev / next + footer */
.pager{display:grid;grid-template-columns:1fr 1fr;margin:clamp(3rem,6vw,5rem) var(--pad) 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.pager a{padding:1rem 0;display:flex;flex-direction:column;transition:opacity .15s}
.pager a:hover{opacity:.6}
.pager a:last-child{text-align:right;border-left:1px solid var(--rule)}
.pager small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;justify-content:space-between;padding:clamp(3rem,6vw,5rem) var(--pad) var(--pad);color:var(--muted);font-size:12px}
.foot a{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

@media(max-width:900px){.intro,.intro.two{grid-template-columns:1fr}.masonry{columns:2}}
@media(max-width:600px){.nav ul li.hide-m{display:none}.banner{height:46vh}.banner .corner{display:none}}
</style>
