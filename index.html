<style>
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Inter Tight";src:url("assets/fonts/InterTight-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}

:root{
  --bg:#E8FF00; --ink:#000; --muted:#6e6e73; --rule:rgba(0,0,0,.1);
  --font:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(15px,2vw,50px); --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--bg)}

.hero{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--pad);overflow:hidden;background:var(--bg)}
.intro{position:relative;z-index:2;text-align:center;opacity:0;transform:translateY(8px);animation:in 1.4s var(--ease) .2s forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro{animation:none;opacity:1;transform:none}}

/* type: IBM Plex Mono tuning */
body{letter-spacing:-.01em;font-feature-settings:'zero' 0}
b,strong{font-weight:500}
/* SAAKA: live face of h1.wtitle on projects/ (Inter Tight 800, -0.055em), one line, never wraps */
.intro h1{font-family:"Inter Tight","Inter",system-ui,sans-serif;font-weight:800;font-size:clamp(72px,24vw,280px);line-height:.9;letter-spacing:-.055em;padding-right:.055em;white-space:nowrap;color:var(--ink);background:none;-webkit-text-fill-color:currentColor}
.intro h1 a{display:inline-block;color:inherit;cursor:pointer;transition:opacity .15s,color .25s ease}
.intro h1 a:hover{opacity:.85}
.intro h1 a:focus-visible{outline:2px solid var(--ink);outline-offset:.06em}
.intro h1 a:active,.intro h1 a.go{color:#fff;-webkit-text-fill-color:#fff;opacity:1}
@media (prefers-reduced-motion:reduce){.intro h1 a{transition:none}}

/* ===== bottom nav ===== */
.bnav{position:absolute;z-index:3;inset:auto 0 0 0;height:2.75rem;display:flex;align-items:center;justify-content:flex-end;padding:0 var(--pad);font-size:11px;letter-spacing:-.01em}
.bnav ul{display:flex;gap:1.5rem;list-style:none}
.bnav a{color:var(--ink);transition:opacity .15s}
.bnav a:hover{opacity:.6}
.bnav a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:600px){.bnav ul{gap:1.1rem}}
</style>
<link rel="preload" href="assets/fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main class="hero" id="top">
  <div class="intro">
    <h1><a href="projects/" id="enter">SAAKA</a></h1>
  </div>
  <nav class="bnav" aria-label="Site">
    <ul>
      <li><a href="projects/">Work</a></li>
      <li><a href="contact/">Contact</a></li>
    </ul>
  </nav>
</main>
<script>
(function(){
  var a=document.getElementById('enter');
  a.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    a.classList.add('go');
    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    e.preventDefault();
    setTimeout(function(){location.href=a.href},300);
  });
})();
</script>
</body>
</html>
