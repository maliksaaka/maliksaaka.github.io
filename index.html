<style>
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}

:root{
  --bg:#fff; --ink:#000; --muted:#6e6e73; --rule:rgba(0,0,0,.1);
  --font:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(15px,2vw,50px); --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:var(--font);overflow:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--bg)}

.hero{--star:var(--ink);position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--pad);overflow:hidden;background:var(--bg)}
.constellation{position:absolute;inset:0;z-index:1;pointer-events:none;display:block}
.intro{position:relative;z-index:2;text-align:center;max-width:46ch;text-wrap:balance;opacity:0;transform:translateY(8px);animation:in 1.4s var(--ease) .2s forwards}
.intro h1{font-weight:400;font-size:clamp(17px,1.6vw,22px);line-height:1.5;letter-spacing:0}
.enter{display:inline-block;margin-top:1.6rem;font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink);background:none;padding:.35rem 0;border-bottom:1px solid var(--rule);transition:color .2s,border-color .2s}
.enter span{display:inline-block;transition:transform .3s var(--ease)}
.enter{border-bottom-color:var(--ink)}
.enter:hover,.enter:focus-visible{opacity:.6;outline:none}
.enter:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.enter:hover span{transform:translateX(4px)}
@keyframes in{to{opacity:1;transform:none}}
.ar{font-family:var(--font);font-size:.8em;line-height:1;display:inline-block;vertical-align:.08em;font-style:normal;font-variant-emoji:text}
@media (prefers-reduced-motion:reduce){.intro{animation:none;opacity:1;transform:none}}

/* type: IBM Plex Mono tuning */
body{letter-spacing:-.01em;font-feature-settings:'zero' 0}
b,strong{font-weight:500}
.ar{font-size:.85em;vertical-align:.04em}
.intro{max-width:44ch}
.intro h1{font-weight:400;font-size:clamp(14px,1.3vw,18px);line-height:1.65;letter-spacing:-.015em}
.enter{font-size:12px}

/* ===== redesign: star chart background + bottom nav ===== */
.sky{position:absolute;inset:-3%;z-index:0;pointer-events:none;background:url("assets/splash/aquarius.jpg") center 38%/cover no-repeat;opacity:.045;filter:grayscale(1);mix-blend-mode:multiply;transform:scale(1.04);will-change:transform}
.bnav{position:absolute;z-index:3;inset:auto 0 0 0;height:2.75rem;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);font-size:11px;letter-spacing:-.01em}
.bnav ul{display:flex;gap:1.5rem;list-style:none}
.bnav a{color:var(--muted);transition:color .15s}
.bnav a.mark{color:var(--ink);font-weight:500;white-space:nowrap}
.bnav a:hover{color:var(--ink)}
.bnav a:focus-visible{outline:1px solid var(--ink);outline-offset:3px;color:var(--ink)}
@media (max-width:600px){.bnav ul{gap:1.1rem}}
@media (prefers-reduced-motion:reduce){.sky{transform:none}}
</style>
</head>
<body>
<main class="hero" id="top">
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="intro">
    <h1>I can do anything.</h1>
    <a class="enter" href="work.html#special-projects">Welcome <span class="ar">&rarr;&#xFE0E;</span></a>
  </div>
  <nav class="bnav" aria-label="Site">
    <a href="index.html" class="mark" aria-current="page">Malik Saaka</a>
    <ul>
      <li><a href="work.html#special-projects">Work</a></li>
      <li><a href="work.html#contact">Contact</a></li>
    </ul>
  </nav>
</main>
<script src="assets/js/star-shape.js" defer></script>
<script src="assets/js/constellation.js" defer></script>
<script src="assets/js/star-cursor.js" defer></script>
<script>
/* very slow parallax: the star chart drifts a few px toward the cursor (skipped under reduced motion / touch) */
(function(){
  var sky=document.getElementById('sky'), rm=matchMedia('(prefers-reduced-motion: reduce)'), fine=matchMedia('(pointer: fine)');
  if(!sky||rm.matches||!fine.matches) return;
  var tx=0,ty=0,x=0,y=0,raf=0,M=14;
  function tick(){ x+=(tx-x)*0.03; y+=(ty-y)*0.03; sky.style.transform='translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,0) scale(1.04)';
    raf=(Math.abs(tx-x)>0.05||Math.abs(ty-y)>0.05)?requestAnimationFrame(tick):0; }
  addEventListener('pointermove',function(e){ tx=(e.clientX/innerWidth-0.5)*2*M; ty=(e.clientY/innerHeight-0.5)*2*M; if(!raf) raf=requestAnimationFrame(tick); },{passive:true});
})();
</script>
</body>
</html>
